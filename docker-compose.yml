services:
  web:
    build: .
    container_name: bengaluru-friends-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
    volumes:
      # Photos and the database survive rebuilds/restarts because they
      # live on your machine, not just inside the container.
      - ./uploads:/app/uploads
      - ./database:/app/database
