services:
  db:
    image: postgres:16-alpine
    container_name: bengaluru-friends-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: bengaluru-friends-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Inside Docker's network the app reaches Postgres via the "db"
      # service name, not "localhost" — this overrides whatever DATABASE_URL
      # is in .env (which is written for connecting from your host machine,
      # e.g. via `npx prisma studio`).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    volumes:
      # Uploaded photos survive rebuilds/restarts because they live on
      # your machine, not just inside the container.
      - ./public/uploads:/app/public/uploads

volumes:
  db-data:
